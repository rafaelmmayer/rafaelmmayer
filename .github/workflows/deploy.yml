name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: rafaelmmayer-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on:
      - self-hosted
      - incus
      - build
      - rafaelmmayer

    steps:
      - name: Deploy on homelab host
        run: ssh -i ~/.ssh/id_ed25519_deploy -o IdentitiesOnly=yes -o BatchMode=yes mayer@10.88.0.1
