when:
  - event: push
    branch: main
  - event: manual

steps:
  - name: build-and-push
    image: docker:29-cli
    pull: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/actions/.docker/config.json:/root/.docker/config.json:ro
    commands:
      - docker build --pull --tag registry.home.arpa:5000/rafaelmmayer-site:${CI_COMMIT_SHA} --tag registry.home.arpa:5000/rafaelmmayer-site:main .
      - docker push registry.home.arpa:5000/rafaelmmayer-site:${CI_COMMIT_SHA}
      - docker push registry.home.arpa:5000/rafaelmmayer-site:main

  - name: deploy
    image: alpine:3.22
    pull: true
    volumes:
      - /home/actions/.ssh/id_ed25519_deploy:/run/deploy/id_ed25519_deploy:ro
      - /home/actions/.ssh/known_hosts:/run/deploy/known_hosts:ro
    commands:
      - apk add --no-cache openssh-client
      - install -d -m 700 ~/.ssh
      - cp /run/deploy/id_ed25519_deploy ~/.ssh/id_ed25519_deploy
      - cp /run/deploy/known_hosts ~/.ssh/known_hosts
      - chmod 600 ~/.ssh/id_ed25519_deploy ~/.ssh/known_hosts
      - |
        ssh -T -i ~/.ssh/id_ed25519_deploy -o IdentitiesOnly=yes -o BatchMode=yes mayer@10.88.0.1 <<'DEPLOY'
        cd /home/mayer/homelab/rafaelmmayer
        docker pull registry.home.arpa:5000/rafaelmmayer-site:main
        docker compose up -d --no-build --remove-orphans
        docker compose ps
        DEPLOY
